name: Tests
on:
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Install Bun (as a package manager).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node runtime for tests.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd docs

      - name: Type check
        run: bun x tsc --noEmit

      - name: Lint JavaScript & TypeScript
        run: bun x eslint .

      - name: Lint Styles
        run: bun x stylelint "src/**/*.scss"

      - name: Run Jest tests
        run: bun run test:ci

      - name: Verify production build
        run: bun run build

      - name: Check documentation diagnostics
        run: bun run docs:check

      - name: Verify documentation build & link integrity
        run: bun run docs:build

      # --- PLAYWRIGHT BYPASS (Medium-to-Large-Screen Refactor) ---
